services:
  tender-aggregator-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/tms?replicaSet=rs0
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:?MAILGUN_API_KEY must be set}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:?MAILGUN_DOMAIN must be set}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:?MAILGUN_FROM_EMAIL must be set}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - RP_ID=${RP_ID:-localhost}
      - RP_NAME=${RP_NAME:-Malaysia Tender Aggregator}
      - ORIGIN=${ORIGIN:-http://localhost:5173}
    networks:
      - default
      - shared-mongo
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 128M

  tender-aggregator-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - tender-aggregator-backend
    networks:
      - default
      - shared-edge
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 24M

networks:
  shared-mongo:
    external: true
  shared-edge:
    external: true